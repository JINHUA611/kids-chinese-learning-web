    <title>小小识字乐园 · 离线版</title>
    <style>:root {
  color-scheme: light;
  --ink: #2e403b;
  --muted: #77847e;
  --paper: #fffdf8;
  --cream: #fff7e8;
  --green: #6db59d;
  --green-dark: #3f806d;
  --line: rgba(67, 92, 83, .12);
  font-family: "Noto Sans SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  background: #f7f2e9;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(circle at 8% 4%, #fff 0 5%, transparent 16%), #f7f2e9; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 4px solid rgba(70, 134, 113, .25); outline-offset: 3px; }
.app-shell { width: min(1180px, 100%); min-height: 100vh; margin: auto; background: var(--paper); box-shadow: 0 0 60px rgba(69, 61, 44, .08); }
.topbar { height: 88px; padding: 0 clamp(24px, 5vw, 64px); display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--line); }
.brand-mark { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 17px 13px 18px 12px; background: #f5ca63; color: #775b20; font-size: 28px; font-weight: 900; transform: rotate(-3deg); }
.topbar-title { flex: 1; font-size: 22px; font-weight: 800; display: flex; flex-direction: column; }
.topbar-title small { margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .08em; }
.sun-doodle { font-size: 28px; color: #e7a934; }
.icon-button { width: 52px; height: 52px; border: 0; border-radius: 50%; background: #f3eee4; font-size: 30px; cursor: pointer; }
.topbar-spacer { width: 52px; }
main { padding: clamp(24px, 4vw, 50px) clamp(22px, 5vw, 64px) 56px; }
.hero { min-height: 190px; padding: 34px clamp(28px, 5vw, 60px); display: flex; align-items: center; justify-content: space-between; border-radius: 34px; background: #e7f4ec; overflow: hidden; }
.hero h1, .page-intro h1 { margin: 4px 0 12px; font-size: clamp(32px, 5vw, 52px); letter-spacing: -.04em; }
.hero p:not(.eyebrow), .page-intro > p:last-child { margin: 0; color: #687b73; font-size: 18px; }
.eyebrow { margin: 0 0 5px; color: var(--green-dark); font-size: 14px; font-weight: 800; letter-spacing: .12em; }
.cloud { position: relative; width: 260px; height: 140px; flex: 0 0 auto; }
.cloud::before { content: ''; position: absolute; inset: 20px 0 0; border-radius: 80px 80px 36px 36px; background: rgba(255,255,255,.72); transform: rotate(2deg); }
.cloud span { position: absolute; z-index: 1; display: grid; place-items: center; width: 68px; height: 68px; border-radius: 22px; background: #fffaf0; box-shadow: 0 8px 18px rgba(61, 97, 78, .09); font: 800 38px serif; }
.cloud span:nth-child(1) { left: 22px; top: 46px; transform: rotate(-8deg); }
.cloud span:nth-child(2) { left: 101px; top: 15px; transform: rotate(4deg); }
.cloud span:nth-child(3) { right: 14px; top: 57px; transform: rotate(9deg); }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: -22px 30px 36px; position: relative; }
.stat-card { padding: 21px 24px; border: 5px solid var(--paper); border-radius: 22px; box-shadow: 0 9px 24px rgba(76, 73, 57, .08); }
.stat-card span { display: block; font-size: 14px; color: #68766f; font-weight: 700; }
.stat-card strong { font-size: 35px; margin-right: 6px; }
.stat-card small { color: #68766f; }
.stat-card.mint { background: #dff2e9; }.stat-card.peach { background: #fbe8dc; }.stat-card.sky { background: #e3f0f4; }
.section-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
.section-heading h2 { margin: 0; font-size: 25px; }.section-heading span { color: #97a19c; font-size: 14px; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.action-card { min-height: 140px; padding: 22px; display: grid; grid-template-columns: 70px 1fr auto; align-items: center; gap: 18px; border: 0; border-radius: 27px; text-align: left; cursor: pointer; transition: transform .16s ease, box-shadow .16s ease; }
.action-card:active { transform: scale(.985); }
.action-card.yellow { background: #fff0bf; }.action-card.green { background: #dff1e8; }.action-card.pink { background: #f8e5e1; }.action-card.blue { background: #e1eef3; }
.action-icon { width: 66px; height: 66px; display: grid; place-items: center; border-radius: 21px; background: rgba(255,255,255,.65); }
.action-icon svg { width: 39px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.action-copy { display: flex; flex-direction: column; gap: 7px; }.action-copy strong { font-size: 24px; }.action-copy small { font-size: 14px; color: #6f7c76; }
.action-link { align-self: end; font-size: 13px; font-weight: 700; }.action-link b { font-size: 19px; margin-left: 5px; }
.recent-card { margin-top: 30px; padding: 24px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border: 1px solid var(--line); border-radius: 25px; }
.recent-card h2 { margin: 3px 0 0; font-size: 20px; }.recent-chars { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.recent-chars button { width: 54px; height: 54px; border: 0; border-radius: 17px; background: #f7f1e6; font: 700 28px serif; cursor: pointer; }.empty-hint { color: var(--muted); }
.study-layout { width: min(740px, 100%); margin: auto; }
.session-meta { display: flex; justify-content: space-between; color: var(--muted); font-weight: 700; }.mode-pill { color: var(--green-dark); }
.mini-progress { height: 8px; margin: 12px 0 22px; border-radius: 8px; background: #ece9e0; overflow: hidden; }.mini-progress i,.wide-progress i { display: block; height: 100%; border-radius: inherit; background: #75bda5; transition: width .25s; }
.character-card { min-height: 440px; padding: 27px; display: flex; flex-direction: column; align-items: center; border-radius: 36px; background: #fff9ec; box-shadow: inset 0 0 0 1px rgba(130, 107, 53, .07); }
.character-card > p { margin: 0; color: var(--muted); font-size: 16px; }.learning-visual { display: flex; align-items: center; justify-content: center; gap: clamp(18px, 4vw, 46px); width: 100%; }.giant-character { margin: 10px 0 -2px; border: 0; background: transparent; font: 700 clamp(150px, 24vw, 215px)/1.15 "KaiTi", "STKaiti", serif; cursor: pointer; }
.character-image { width: clamp(112px, 18vw, 150px); aspect-ratio: 1; margin: 0; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 32px; background: #e8f3ec; box-shadow: inset 0 0 0 1px rgba(69, 116, 91, .08); }.character-image > span { font-size: clamp(60px, 9vw, 82px); line-height: 1; }.character-image figcaption { margin-top: 8px; color: #658075; font-size: 13px; font-weight: 700; }
.pinyin { font-size: 28px; color: #b06e4d; font-weight: 700; }.word-chips { display: flex; gap: 14px; margin-top: 20px; }.word-chips button { min-height: 48px; padding: 9px 18px; border: 0; border-radius: 999px; background: #f4ead8; font-size: 19px; cursor: pointer; transition: transform .15s ease, background .15s ease; }.word-chips button span { margin-left: 7px; color: #b06e4d; font-size: 15px; }.word-chips button:active { transform: scale(.94); background: #ead9bd; }
.speak-hint { margin-top: 18px; color: #a19d91; }.decision-buttons { display: grid; grid-template-columns: 1fr 1.25fr; gap: 18px; margin-top: 22px; }
.decision { min-height: 94px; display: grid; grid-template-columns: 44px 1fr; grid-template-rows: 1fr 1fr; column-gap: 10px; align-items: end; padding: 17px 24px; border-radius: 24px; cursor: pointer; }
.decision > span { grid-row: 1 / 3; align-self: center; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; font-size: 25px; }.decision strong { font-size: 22px; }.decision small { align-self: start; opacity: .72; }
.decision.secondary { border: 2px solid #ddd4c5; background: #fff; }.decision.secondary > span { background: #f2ece3; }.decision.primary { border: 0; background: #70b89f; color: white; box-shadow: 0 9px 20px rgba(67, 128, 107, .2); }.decision.primary > span { background: rgba(255,255,255,.2); }
.center-message { min-height: 65vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }.center-message h1 { font-size: 38px; margin: 8px; }.center-message > p:not(.eyebrow) { color: var(--muted); font-size: 19px; }.celebrate { width: 100px; height: 100px; display: grid; place-items: center; margin-bottom: 20px; border-radius: 35px; background: #fff0bd; color: #d99d27; font-size: 55px; transform: rotate(-4deg); }
.big-home-button,.continue-button,.empty-panel button { min-height: 60px; padding: 0 36px; border: 0; border-radius: 19px; background: var(--green); color: white; font-weight: 800; font-size: 18px; cursor: pointer; }
.page-intro { padding: 10px 0 28px; }.page-intro h1 { font-size: clamp(34px, 5vw, 48px); }.page-intro em { color: #d58c55; font-style: normal; }
.known-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 17px; }.hanzi-tile { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #eee6da; border-radius: 25px; background: #fffaf0; cursor: pointer; }.hanzi-tile:nth-child(3n+2) { background: #f0f8f3; }.hanzi-tile:nth-child(3n) { background: #f7edef; }.hanzi-tile strong { font: 700 55px serif; }.hanzi-tile small { color: var(--muted); font-size: 15px; }
.empty-panel { grid-column: 1/-1; min-height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #e4ded2; border-radius: 30px; }.empty-panel > span { font-size: 50px; }.empty-panel h2 { margin-bottom: 0; }.empty-panel p { color: var(--muted); }
.detail-card { position: relative; display: flex; align-items: center; gap: 35px; margin-bottom: 25px; padding: 20px 35px; border-radius: 25px; background: #e8f3ec; }.detail-card > strong { font: 700 90px serif; }.detail-card h2 { margin: 0 0 8px; }.detail-card p { margin: 0; font-size: 19px; }.detail-close { position: absolute; right: 16px; top: 12px; border: 0; background: transparent; font-size: 28px; cursor: pointer; }
.progress-overview { display: flex; align-items: center; gap: clamp(35px, 7vw, 90px); padding: 35px clamp(25px, 6vw, 70px); border-radius: 30px; background: #e9f4ed; }.progress-ring { --progress: 0deg; width: 190px; aspect-ratio: 1; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(#69b297 var(--progress), #d4e5da 0); }.progress-ring::before { content: ''; grid-area: 1/1; width: 150px; aspect-ratio: 1; border-radius: 50%; background: var(--paper); }.progress-ring div { grid-area: 1/1; z-index: 1; display: flex; flex-direction: column; align-items: center; }.progress-ring strong { font-size: 43px; }.progress-ring small { color: var(--muted); }.progress-copy { flex: 1; }.progress-copy h2 { font-size: 28px; margin: 0 0 10px; }.progress-copy p { color: var(--muted); font-size: 17px; }.wide-progress { height: 12px; margin-top: 22px; background: #d4e5da; border-radius: 10px; overflow: hidden; }
.progress-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }.progress-stat { display: flex; align-items: center; gap: 14px; padding: 22px; border: 1px solid var(--line); border-radius: 22px; }.progress-stat > span { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 15px; font-weight: 900; background: #f4eddf; }.progress-stat div { display: flex; flex-direction: column; }.progress-stat small { color: var(--muted); }.progress-stat strong { font-size: 28px; }.progress-stat strong i { font-size: 13px; font-style: normal; }.progress-stat.check > span { background: #ddf0e7; color: #43836e; }.progress-stat.pencil > span { background: #fbe8dc; color: #b66f4a; }.progress-stat.seed > span { background: #e6eef3; color: #517c92; }
.continue-button { display: block; margin: 28px auto 0; }.continue-button span { margin-left: 18px; }

@media (max-width: 720px) {
  .topbar { height: 76px; padding-inline: 20px; }.topbar-title { font-size: 19px; }main { padding: 20px 17px 40px; }
  .hero { min-height: 180px; padding: 28px 24px; }.hero h1 { font-size: 34px; }.cloud { width: 125px; transform: scale(.75); transform-origin: right center; margin-left: -20px; }
  .stats-row { gap: 8px; margin: -15px 10px 28px; }.stat-card { padding: 16px 12px; border-width: 3px; }.stat-card strong { font-size: 29px; }.stat-card small { font-size: 11px; }
  .action-grid { grid-template-columns: 1fr; gap: 13px; }.action-card { min-height: 112px; grid-template-columns: 60px 1fr auto; padding: 17px; }.action-icon { width: 58px; height: 58px; }.action-copy strong { font-size: 21px; }
  .recent-card { align-items: flex-start; flex-direction: column; }.recent-chars { justify-content: flex-start; }
  .character-card { min-height: 390px; }.learning-visual { gap: 10px; }.character-image { width: 104px; border-radius: 25px; }.character-image > span { font-size: 56px; }.decision-buttons { gap: 10px; }.decision { padding: 14px; grid-template-columns: 38px 1fr; }.decision > span { width: 38px; height: 38px; }.decision strong { font-size: 19px; }.decision small { font-size: 11px; }
  .known-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }.hanzi-tile { border-radius: 20px; }.hanzi-tile strong { font-size: 46px; }
  .progress-overview { flex-direction: column; text-align: center; }.progress-ring { width: 170px; }.progress-ring::before { width: 134px; }.progress-stats { grid-template-columns: 1fr 1fr; }.progress-stat { padding: 17px 14px; }
}

@media (max-width: 430px) {
  .hero { min-height: 170px; }.hero p:not(.eyebrow) { font-size: 15px; }.cloud { display: none; }.stats-row { margin-inline: 0; }.stat-card span { font-size: 12px; }
  .section-heading span,.action-link { display: none; }.action-card { grid-template-columns: 58px 1fr; }.learning-visual { flex-direction: column; gap: 0; }.character-image { width: 88px; margin-top: -12px; }.character-image > span { font-size: 46px; }.character-image figcaption { display: none; }.word-chips button { padding: 8px 15px; }.speak-hint { font-size: 11px; }
}

@media (orientation: landscape) and (max-height: 700px) {
  .topbar { height: 68px; }.study-layout { width: min(940px, 100%); }.character-card { min-height: 330px; padding: 15px; }.giant-character { font-size: 145px; margin-block: 0; }.character-image { width: 105px; }.character-image > span { font-size: 58px; }.word-chips { margin-top: 9px; }.speak-hint { margin-top: 9px; }.decision { min-height: 78px; }.decision-buttons { margin-top: 14px; }
}

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

const STORAGE_KEY = 'little-hanzi-learning-v1';

const emptyData = () => ({ version: 1, records: {} });

function createLearningStore(storage, now = () => new Date()) {
  function load() {
    try {
      const saved = JSON.parse(storage.getItem(STORAGE_KEY));
      if (saved?.version === 1 && saved.records && typeof saved.records === 'object') return saved;
    } catch {
      // 损坏或旧格式的数据不阻止孩子继续使用。
    }
    return emptyData();
  }

  function save(data) {
    storage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function mark(characterId, status) {
    if (!['known', 'learning'].includes(status)) throw new Error('Unknown learning status');
    const data = load();
    const timestamp = now().toISOString();
    const previous = data.records[characterId] ?? {
      status: 'unseen', firstLearnedAt: timestamp, lastLearnedAt: timestamp,
      studyCount: 0, knownCount: 0, learningCount: 0
    };
    data.records[characterId] = {
      ...previous,
      status,
      firstLearnedAt: previous.firstLearnedAt || timestamp,
      lastLearnedAt: timestamp,
      studyCount: previous.studyCount + 1,
      knownCount: previous.knownCount + (status === 'known' ? 1 : 0),
      learningCount: previous.learningCount + (status === 'learning' ? 1 : 0)
    };
    save(data);
    return data.records[characterId];
  }

  function getRecord(characterId) {
    return load().records[characterId] ?? null;
  }

  function getStats(characterList) {
    const records = load().records;
    const known = characterList.filter(({ id }) => records[id]?.status === 'known').length;
    const learning = characterList.filter(({ id }) => records[id]?.status === 'learning').length;
    const total = characterList.length;
    return { total, known, learning, unseen: total - known - learning, percent: total ? Math.round((known / total) * 100) : 0 };
  }

  function isLibraryComplete(characterList) {
    const stats = getStats(characterList);
    return stats.total > 0 && stats.known === stats.total;
  }

  function getTodayCount(characterList) {
    const today = localDateKey(now());
    return characterList.filter(({ id }) => {
      const value = load().records[id]?.lastLearnedAt;
      return value && localDateKey(new Date(value)) === today;
    }).length;
  }

  function getRecent(characterList, limit = 5) {
    const records = load().records;
    return characterList.filter(({ id }) => records[id]).sort((a, b) =>
      new Date(records[b.id].lastLearnedAt) - new Date(records[a.id].lastLearnedAt)
    ).slice(0, limit);
  }

  function getReviewQueue(characterList) {
    const records = load().records;
    return characterList.filter(({ id }) => records[id]?.status === 'learning')
      .sort((a, b) => new Date(records[a.id].lastLearnedAt) - new Date(records[b.id].lastLearnedAt));
  }

  // 今日识字在全部字都学过后仍沿用原有兜底顺序，不影响“复习一下”的范围。
  function getPracticeQueue(characterList) {
    const records = load().records;
    const learning = getReviewQueue(characterList);
    const known = characterList.filter(({ id }) => records[id]?.status === 'known')
      .sort((a, b) => new Date(records[a.id].lastLearnedAt) - new Date(records[b.id].lastLearnedAt));
    return [...learning, ...known];
  }

  return { load, mark, getRecord, getStats, isLibraryComplete, getTodayCount, getRecent, getReviewQueue, getPracticeQueue };
}

function localDateKey(date) {
  return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
}

/**
 * 使用设备自带的 Web Speech API 朗读普通话，不依赖网络接口。
 * 华为 Pad 浏览器会使用系统中可用的中文语音；若没有中文语音，仍由
 * 浏览器根据 zh-CN 语言标记选择最合适的系统语音。
 */
function createMandarinSpeaker({
  synth = globalThis.speechSynthesis,
  Utterance = globalThis.SpeechSynthesisUtterance
} = {}) {
  return function speak(text) {
    if (!text || !synth || !Utterance) return false;

    const utterance = new Utterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.78;
    utterance.pitch = 1.05;
    utterance.volume = 1;

    const voices = typeof synth.getVoices === 'function' ? synth.getVoices() : [];
    const mandarinVoice = voices.find(voice => /^zh[-_]CN$/i.test(voice.lang))
      || voices.find(voice => /^zh[-_](Hans|SG)/i.test(voice.lang))
      || voices.find(voice => /^zh/i.test(voice.lang));
    if (mandarinVoice) utterance.voice = mandarinVoice;

    // 连续点击时停止上一次朗读，避免多个声音叠在一起。
    synth.cancel();
    synth.speak(utterance);
    return true;
  };
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function renderCharacterImage(image) {
  if (!image?.symbol) return '';

  const alt = escapeHtml(image.alt || '汉字配图');
  return `<figure class="character-image" role="img" aria-label="${alt}">
    <span aria-hidden="true">${escapeHtml(image.symbol)}</span>
    <figcaption>${alt}</figcaption>
  </figure>`;
}


const app = document.querySelector('#app');
const store = createLearningStore(window.localStorage);
const speakMandarin = createMandarinSpeaker();
const DAILY_GOAL = 5;
let session = null;

const icons = {
  learn: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 13c6-3 12-2 16 2 4-4 10-5 16-2v25c-6-3-12-2-16 2-4-4-10-5-16-2V13Z"/><path d="M24 15v25"/></svg>',
  review: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M39 19a16 16 0 1 0 1 12"/><path d="m33 11 7 8 3-10"/></svg>',
  known: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 41S7 32 7 19a9 9 0 0 1 17-4 9 9 0 0 1 17 4c0 13-17 22-17 22Z"/></svg>',
  progress: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 39V25h8v14M20 39V17h8v22M31 39V9h8v30"/></svg>'
};

function shell(content, options = {}) {
  const { back = false, title = '' } = options;
  app.innerHTML = `<div class="app-shell">
    <header class="topbar ${back ? '' : 'home-topbar'}">
      ${back ? '<button class="icon-button" data-route="home" aria-label="返回首页">←</button>' : '<div class="brand-mark" aria-hidden="true">小</div>'}
      <div class="topbar-title">${title || '<span>小小识字</span><small>快乐学习每一天</small>'}</div>
      ${back ? '<div class="topbar-spacer"></div>' : '<div class="sun-doodle" aria-hidden="true">☀</div>'}
    </header>
    <main>${content}</main>
  </div>`;
}

function renderHome() {
  session = null;
  const stats = store.getStats(characters);
  const isComplete = store.isLibraryComplete(characters);
  const today = store.getTodayCount(characters);
  const recent = store.getRecent(characters);
  shell(`<section class="hero">
      <div><p class="eyebrow">${isComplete ? '第一阶段完成啦！🎉' : '你好呀，小朋友！'}</p><h1>${isComplete ? `你已经完成当前全部 ${stats.total} 个汉字学习` : '今天继续识字吧 <span aria-hidden="true">🌱</span>'}</h1><p>${isComplete ? '当前字库已全部学完，可以继续扩充下一阶段字库。' : '每天认识一点点，汉字朋友越来越多。'}</p></div>
      <div class="cloud" aria-hidden="true"><span>人</span><span>山</span><span>水</span></div>
    </section>
    <section class="stats-row" aria-label="学习数据">
      ${statCard('已认识', stats.known, '个字', 'mint')}
      ${statCard('正在学习', stats.learning, '个字', 'peach')}
      ${statCard('今日学习', today, '个字', 'sky')}
    </section>
    <section class="section-block"><div class="section-heading"><h2>想做什么呢？</h2><span>点一点就开始</span></div>
      <div class="action-grid">
        ${actionCard('learn', '今日识字', '认识新的汉字朋友', '开始学习', 'yellow')}
        ${actionCard('review', '复习一下', '和学过的字再见面', '开始复习', 'green')}
        ${actionCard('known', '我认识的字', `已经认识 ${stats.known} 个字`, '去看看', 'pink')}
        ${actionCard('progress', '学习进度', `已经完成 ${stats.percent}%`, '看进度', 'blue')}
      </div>
    </section>
    <section class="recent-card"><div><p class="eyebrow">最近学习</p><h2>${recent.length ? '这些字还记得吗？' : '你的汉字旅程等你开始'}</h2></div>
      <div class="recent-chars">${recent.length ? recent.map(c => `<button data-character="${c.id}" aria-label="查看${c.char}字">${c.char}</button>`).join('') : '<span class="empty-hint">学过的字会出现在这里</span>'}</div>
    </section>`, { title: '' });
}

function statCard(label, number, unit, tone) {
  return `<article class="stat-card ${tone}"><span>${label}</span><strong>${number}</strong><small>${unit}</small></article>`;
}

function actionCard(route, title, subtitle, label, tone) {
  return `<button class="action-card ${tone}" data-route="${route}"><span class="action-icon">${icons[route]}</span><span class="action-copy"><strong>${title}</strong><small>${subtitle}</small></span><span class="action-link">${label}<b>→</b></span></button>`;
}

function startSession(mode) {
  let queue;
  if (mode === 'review') {
    queue = store.getReviewQueue(characters);
    if (!queue.length) return renderEmptyReview();
  } else {
    if (store.isLibraryComplete(characters)) return renderAllComplete();
    const unseen = characters.filter(c => !store.getRecord(c.id));
    queue = (unseen.length ? unseen : store.getPracticeQueue(characters)).slice(0, DAILY_GOAL);
  }
  session = { mode, queue, index: 0 };
  renderStudy();
}

function renderStudy() {
  const character = session.queue[session.index];
  const isReview = session.mode === 'review';
  shell(`<section class="study-layout">
    <div class="session-meta"><span class="mode-pill">${isReview ? '温故知新' : '今日识字'}</span><span>${session.index + 1} / ${session.queue.length}</span></div>
    <div class="mini-progress"><i style="width:${((session.index + 1) / session.queue.length) * 100}%"></i></div>
    <article class="character-card">
      <p>${isReview ? '还记得这个字吗？' : '请大声读一读'}</p>
      <div class="learning-visual">
        <button class="giant-character" data-speak="${character.id}" aria-label="${character.char}，${character.pinyin}">${character.char}</button>
        ${renderCharacterImage(character.image)}
      </div>
      <div class="pinyin">${character.pinyin}</div>
      <div class="word-chips" aria-label="点击词语听读音">${character.words.map(word => `<button type="button" data-speak="${word}" aria-label="朗读${word}">${word}<span aria-hidden="true">♪</span></button>`).join('')}</div>
      <small class="speak-hint">轻点汉字 · 听普通话读音</small>
    </article>
    <div class="decision-buttons">
      <button class="decision secondary" data-answer="learning"><span>↻</span><strong>再学学</strong><small>我们再见几次</small></button>
      <button class="decision primary" data-answer="known"><span>✓</span><strong>认识了</strong><small>真棒，继续前进</small></button>
    </div>
  </section>`, { back: true, title: isReview ? '复习一下' : '今日识字' });
}

function answer(status) {
  const current = session.queue[session.index];
  store.mark(current.id, status);
  if (session.index < session.queue.length - 1) {
    session.index += 1;
    renderStudy();
  } else renderComplete();
}

function renderComplete() {
  const stats = store.getStats(characters);
  shell(`<section class="center-message"><div class="celebrate">★</div><p class="eyebrow">完成啦</p><h1>今天表现得真棒！</h1><p>你已经认识 <strong>${stats.known}</strong> 个汉字朋友了。</p><button class="big-home-button" data-route="home">回到首页</button></section>`, { back: true, title: '学习完成' });
}

function renderEmptyReview() {
  shell(`<section class="center-message"><div class="celebrate">☁</div><h1>暂时没有需要复习的字</h1><p>继续认识新朋友吧！</p><button class="big-home-button" data-route="learn">去识字</button></section>`, { back: true, title: '复习一下' });
}

function renderAllComplete() {
  const total = characters.length;
  shell(`<section class="center-message"><div class="celebrate">★</div><p class="eyebrow">第一阶段完成啦！🎉</p><h1>全部汉字都认识了</h1><p>你已经完成当前全部 <strong>${total}</strong> 个汉字学习。</p><button class="big-home-button" data-route="home">回到首页</button></section>`, { back: true, title: '学习完成' });
}

function renderKnown(focusId) {
  const known = characters.filter(c => store.getRecord(c.id)?.status === 'known');
  const focus = focusId ? characters.find(c => c.id === focusId) : null;
  shell(`<section class="page-intro"><p class="eyebrow">我的汉字收藏</p><h1>我已经认识 <em>${known.length}</em> 个字</h1><p>每一个字，都是你努力的证明。</p></section>
    ${focus ? detailCard(focus) : ''}
    <section class="known-grid">${known.length ? known.map(c => `<button data-character="${c.id}" class="hanzi-tile"><strong>${c.char}</strong><small>${c.pinyin}</small></button>`).join('') : '<div class="empty-panel"><span>🌱</span><h2>这里还空空的</h2><p>去认识第一个汉字朋友吧！</p><button data-route="learn">开始识字</button></div>'}</section>`, { back: true, title: '我认识的字' });
}

function detailCard(c) {
  return `<article class="detail-card"><button class="detail-close" data-route="known" aria-label="关闭">×</button><strong>${c.char}</strong><div><h2>${c.pinyin}</h2><p>${c.words.join(' · ')}</p></div></article>`;
}

function renderProgress() {
  const s = store.getStats(characters);
  shell(`<section class="page-intro"><p class="eyebrow">一点一点在长大</p><h1>学习进度</h1><p>坚持每天认识几个汉字，慢慢就会读故事啦。</p></section>
    <section class="progress-overview"><div class="progress-ring" style="--progress:${s.percent * 3.6}deg"><div><strong>${s.percent}%</strong><small>整体进度</small></div></div>
      <div class="progress-copy"><h2>${s.known ? '又向前走了一步！' : '从第一个字开始吧！'}</h2><p>已认识 ${s.known} 个，共有 ${s.total} 个汉字朋友。</p><div class="wide-progress"><i style="width:${s.percent}%"></i></div></div>
    </section>
    <section class="progress-stats">
      ${progressStat('总字库', s.total, 'book')}${progressStat('已认识', s.known, 'check')}${progressStat('正在学习', s.learning, 'pencil')}${progressStat('未学习', s.unseen, 'seed')}
    </section>
    <button class="continue-button" data-route="learn">继续识字 <span>→</span></button>`, { back: true, title: '学习进度' });
}

function progressStat(label, number, icon) {
  const symbols = { book: '册', check: '✓', pencil: '✎', seed: '芽' };
  return `<article class="progress-stat ${icon}"><span>${symbols[icon]}</span><div><small>${label}</small><strong>${number}<i> 字</i></strong></div></article>`;
}

function navigate(route) {
  if (route === 'home') renderHome();
  if (route === 'learn') startSession('learn');
  if (route === 'review') startSession('review');
  if (route === 'known') renderKnown();
  if (route === 'progress') renderProgress();
}

app.addEventListener('click', event => {
  const route = event.target.closest('[data-route]')?.dataset.route;
  const answerValue = event.target.closest('[data-answer]')?.dataset.answer;
  const characterId = event.target.closest('[data-character]')?.dataset.character;
  const speakText = event.target.closest('[data-speak]')?.dataset.speak;
  if (route) navigate(route);
  else if (answerValue) answer(answerValue);
  else if (characterId) renderKnown(characterId);
  else if (speakText) speakMandarin(speakText);
});

renderHome();
</script>

</html>
